<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>JewelryLead admin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #0e0d0c; --surface: #171512; --line: #2b2722; --ink: #f2ede4; --soft: #9f978a; --gold: #d8b46a; --red: #e58b7a; }
    * { box-sizing: border-box; }
    .mini { background: none; border: 1px solid var(--line); color: var(--soft); border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
    .mini:hover { color: var(--ink); border-color: var(--gold); }
    a { color: var(--gold); }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: Manrope, system-ui, sans-serif; font-size: 14px; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .muted { color: var(--soft); }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 22px 0 28px; }
    .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .stat b { display: block; font-size: 26px; margin-top: 4px; }
    .lead { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
    .lead header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .lead h2 { font-size: 16px; margin: 0; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .tag { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--soft); }
    .tag b { color: var(--ink); font-weight: 600; }
    .vision { color: var(--soft); margin: 6px 0 12px; font-style: italic; }
    .imgs { display: flex; flex-wrap: wrap; gap: 10px; }
    figure { margin: 0; width: 180px; }
    figure img { width: 180px; height: 180px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); display: block; background: #000; }
    figcaption { font-size: 11px; color: var(--soft); margin-top: 4px; line-height: 1.4; }
    .more { text-align: center; margin: 18px 0; }
    .more button { padding: 10px 18px; }
    .spam { opacity: 0.6; }
    .err { width: 180px; height: 180px; border-radius: 10px; border: 1px dashed var(--red); color: var(--red); font-size: 11px; padding: 10px; overflow: auto; }
    .login { max-width: 360px; margin: 90px auto; display: flex; gap: 8px; }
    input { flex: 1; background: var(--surface); border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 11px 13px; font: inherit; }
    button { background: var(--gold); color: #17130c; border: 0; border-radius: 10px; padding: 0 16px; font-weight: 700; cursor: pointer; }
    a { color: var(--gold); }
  </style>
</head>
<body>
  <div class="wrap" id="root"></div>
  <script src="/admin.js" defer></script>
</body>
</html>
